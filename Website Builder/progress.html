<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #f7f4ff, #eef7ff);
    color: #202040;
}

/* ================= NAVBAR ================= */

header {
    background: rgba(255,255,255,0.96);
    padding: 15px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(60,50,120,0.12);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    color: #5b42d6;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

nav a {
    text-decoration: none;
    color: #444;
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
}

nav a:hover {
    background: #eeeaff;
    color: #5b42d6;
}

nav a.active {
    background: linear-gradient(135deg, #6954e8, #8d70ff);
    color: white;
}


/* ================= HERO ================= */

.hero {
    text-align: center;
    padding: 55px 20px 35px;
}

.hero h1 {
    font-size: 42px;
    color: #5140bd;
    margin-bottom: 12px;
}

.hero p {
    color: #666;
    font-size: 17px;
}


/* ================= MAIN ================= */

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}


/* ================= SELECTED CAREER ================= */

.selected-career {
    background: white;
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(70,50,150,0.13);
    margin-bottom: 25px;
}

.selected-career h2 {
    color: #5744c8;
    margin-bottom: 12px;
}

#careerName {
    font-size: 30px;
    font-weight: 800;
    color: #222;
}

.no-career {
    color: #888;
}


/* ================= OVERALL PROGRESS ================= */

.overall {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(70,50,150,0.12);
    margin-bottom: 30px;
}

.overall-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.overall-top h2 {
    color: #5140bd;
}

#overallPercent {
    font-size: 30px;
    font-weight: 800;
    color: #6652df;
}

.progress-bar {
    height: 18px;
    width: 100%;
    background: #e8e5f5;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6550e8, #a080ff);
    border-radius: 20px;
    transition: 0.5s;
}

.progress-message {
    margin-top: 14px;
    color: #666;
}


/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.stat-card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 7px 25px rgba(50,40,100,0.09);
}

.stat-card span {
    font-size: 30px;
}

.stat-card h3 {
    margin: 8px 0;
    color: #5542c7;
}

.stat-card p {
    color: #777;
}


/* ================= SKILLS ================= */

.skills-box {
    background: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(70,50,150,0.12);
    margin-bottom: 30px;
}

.skills-box h2 {
    color: #5140bd;
    margin-bottom: 8px;
}

.skills-subtitle {
    color: #777;
    margin-bottom: 25px;
}

.skill-card {
    background: #f9f8ff;
    border: 2px solid #eeeafa;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 15px;
    transition: 0.3s;
}

.skill-card:hover {
    transform: translateX(5px);
    border-color: #c8bfff;
}

.skill-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.skill-name {
    font-size: 17px;
    font-weight: 700;
}

.skill-percent {
    color: #624ed8;
    font-weight: 800;
}

.skill-bar {
    width: 100%;
    height: 10px;
    background: #e5e2f0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 13px;
}

.skill-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6954e8, #9b82ff);
    border-radius: 20px;
    transition: 0.4s;
}

.skill-actions {
    display: flex;
    gap: 8px;
}

.skill-actions button {
    border: none;
    padding: 7px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 700;
}

.minus {
    background: #ffe9e9;
    color: #b84b4b;
}

.plus {
    background: #e8e4ff;
    color: #5c49d2;
}

.complete {
    background: #ddf7ea;
    color: #18804d;
}


/* ================= MILESTONE ================= */

.milestone {
    background: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(70,50,150,0.12);
    margin-bottom: 60px;
}

.milestone h2 {
    color: #5140bd;
    margin-bottom: 20px;
}

.milestone-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    border-radius: 15px;
    background: #f8f7ff;
    margin-bottom: 10px;
}

.milestone-icon {
    font-size: 28px;
}

.milestone-item.locked {
    opacity: 0.45;
}


/* ================= EMPTY ================= */

.empty-state {
    text-align: center;
    padding: 50px 20px;
    background: white;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(60,50,120,0.1);
}

.empty-state h2 {
    margin-bottom: 10px;
}

.empty-state p {
    color: #777;
}


/* ================= FOOTER ================= */

footer {
    background: #17204d;
    color: white;
    text-align: center;
    padding: 35px 20px;
    border-radius: 10% 10% 0 0;
}

footer p {
    color: #cbd0ef;
    margin-top: 8px;
}


/* ================= RESPONSIVE ================= */

@media(max-width: 750px) {

    header {
        flex-direction: column;
        gap: 12px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .overall-top {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
    }
}

</style>
</head>

/* =====================================================
   COMMON SKILLS FOR CAREERS NOT EXPLICITLY LISTED
===================================================== */

const commonSkills = [
    "Communication",
    "Problem Solving",
    "Critical Thinking",
    "Teamwork",
    "Time Management",
    "Technology"
];


/* =====================================================
   GET SELECTED CAREER
===================================================== */

const selectedCareer =
    localStorage.getItem("selectedCareer");


/* =====================================================
   MAIN CONTENT
===================================================== */

const mainContent =
    document.getElementById("mainContent");


if(!selectedCareer) {

    mainContent.innerHTML = `

        <div class="empty-state">

            <h2>🎯 No Career Selected Yet</h2>

            <p>
                Please choose a career first from the
                Selected Career page.
            </p>

        </div>

    `;

} else {

    renderProgress(selectedCareer);

}


/* =====================================================
   RENDER PROGRESS
===================================================== */

function renderProgress(career) {

    let skills =
        careerSkills[career];

    if(!skills) {

        skills = commonSkills;

    }

    const storageKey =
        "skillProgress_" + career;

    let saved =
        JSON.parse(
            localStorage.getItem(storageKey)
        ) || {};


    /* Make sure every skill has a value */

    skills.forEach(skill => {

        if(saved[skill] === undefined) {

            saved[skill] = 0;

        }

    });


    localStorage.setItem(
        storageKey,
        JSON.stringify(saved)
    );


    mainContent.innerHTML = `

        <!-- SELECTED CAREER -->

        <section class="selected-career">

            <h2>🎯 Your Chosen Career</h2>

            <div id="careerName">
                ${career}
            </div>

        </section>


        <!-- OVERALL -->

        <section class="overall">

            <div class="overall-top">

                <h2>🚀 Overall Career Progress</h2>

                <span id="overallPercent">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="overallFill">
                </div>

            </div>

            <p
                class="progress-message"
                id="progressMessage">
                Start learning your required skills!
            </p>

        </section>


        <!-- STATS -->

        <section class="stats">

            <div class="stat-card">

                <span>📚</span>

                <h3 id="totalSkills">
                    0
                </h3>

                <p>Total Skills</p>

            </div>


            <div class="stat-card">

                <span>✅</span>

                <h3 id="completedSkills">
                    0
                </h3>

                <p>Completed Skills</p>

            </div>


            <div class="stat-card">

                <span>🔥</span>

                <h3 id="remainingSkills">
                    0
                </h3>

                <p>Skills Remaining</p>

            </div>

        </section>


        <!-- SKILLS -->

        <section class="skills-box">

            <h2>🧠 Skills You Need</h2>

            <p class="skills-subtitle">
                Improve each skill and track your progress.
            </p>

            <div id="skillsContainer"></div>

        </section>


        <!-- MILESTONES -->

        <section class="milestone">

            <h2>🏆 Your Milestones</h2>

            <div
                id="milestones">
            </div>

        </section>

    `;


    const skillsContainer =
        document.getElementById("skillsContainer");


    /* CREATE SKILL CARDS */

    skills.forEach((skill, index) => {

        const value =
            saved[skill] || 0;

        const card =
            document.createElement("div");

        card.className =
            "skill-card";

        card.innerHTML = `

            <div class="skill-top">

                <span class="skill-name">
                    ${getSkillIcon(skill)}
                    ${skill}
                </span>

                <span
                    class="skill-percent"
                    id="percent-${index}">
                    ${value}%
                </span>

            </div>


            <div class="skill-bar">

                <div
                    class="skill-fill"
                    id="fill-${index}"
                    style="width:${value}%">
                </div>

            </div>


            <div class="skill-actions">

                <button
                    class="minus"
                    onclick="changeSkill(
                        '${escapeSkill(skill)}',
                        -10
                    )">
                    −10
                </button>


                <button
                    class="plus"
                    onclick="changeSkill(
                        '${escapeSkill(skill)}',
                        10
                    )">
                    +10
                </button>


                <button
                    class="complete"
                    onclick="completeSkill(
                        '${escapeSkill(skill)}'
                    )">
                    ✓ Complete
                </button>

            </div>

        `;

        skillsContainer.appendChild(card);

    });


    updateProgress(career, skills, saved);

}


/* =====================================================
   CHANGE SKILL
===================================================== */

function changeSkill(skill, amount) {

    const career =
        localStorage.getItem("selectedCareer");

    const storageKey =
        "skillProgress_" + career;

    let saved =
        JSON.parse(
            localStorage.getItem(storageKey)
        ) || {};

    saved[skill] =
        Math.max(
            0,
            Math.min(
                100,
                (saved[skill] || 0) + amount
            )
        );

    localStorage.setItem(
        storageKey,
        JSON.stringify(saved)
    );

    renderProgress(career);

}


/* =====================================================
   COMPLETE SKILL
===================================================== */

function completeSkill(skill) {

    const career =
        localStorage.getItem("selectedCareer");

    const storageKey =
        "skillProgress_" + career;

    let saved =
        JSON.parse(
            localStorage.getItem(storageKey)
        ) || {};

    saved[skill] = 100;

    localStorage.setItem(
        storageKey,
        JSON.stringify(saved)
    );

    renderProgress(career);

}


/* =====================================================
   UPDATE OVERALL
===================================================== */

function updateProgress(
    career,
    skills,
    saved
) {

    let total = 0;

    let completed = 0;

    skills.forEach(skill => {

        const value =
            saved[skill] || 0;

        total += value;

        if(value === 100) {

            completed++;

        }

    });


    const overall =
        Math.round(
            total / skills.length
        );


    document.getElementById(
        "overallPercent"
    ).innerText =
        overall + "%";


    document.getElementById(
        "overallFill"
    ).style.width =
        overall + "%";


    document.getElementById(
        "totalSkills"
    ).innerText =
        skills.length;


    document.getElementById(
        "completedSkills"
    ).innerText =
        completed;


    document.getElementById(
        "remainingSkills"
    ).innerText =
        skills.length - completed;


    /* MESSAGE */

    const message =
        document.getElementById(
            "progressMessage"
        );


    if(overall === 0) {

        message.innerText =
            "🌱 Start learning your required skills!";

    }

    else if(overall < 25) {

        message.innerText =
            "🌱 Great start! Keep learning.";

    }

    else if(overall < 50) {

        message.innerText =
            "🔥 You're making progress!";

    }

    else if(overall < 75) {

        message.innerText =
            "🚀 You're halfway there!";

    }

    else if(overall < 100) {

        message.innerText =
            "⭐ Amazing! You're almost ready!";

    }

    else {

        message.innerText =
            "🏆 Fantastic! You've completed all listed skills!";

    }


    updateMilestones(overall);

}


/* =====================================================
   MILESTONES
===================================================== */

function updateMilestones(progress) {

    const container =
        document.getElementById(
            "milestones"
        );


    const milestones = [

        {
            value: 25,
            icon: "🌱",
            title: "First Step",
            text: "You reached 25% progress!"
        },

        {
            value: 50,
            icon: "🔥",
            title: "Halfway Hero",
            text: "You reached 50% progress!"
        },

        {
            value: 75,
            icon: "🚀",
            title: "Almost There",
            text: "You reached 75% progress!"
        },

        {
            value: 100,
            icon: "🏆",
            title: "Career Ready",
            text: "You reached 100% progress!"
        }

    ];


    container.innerHTML = "";


    milestones.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "milestone-item";


        if(progress < item.value) {

            div.classList.add(
                "locked"
            );

        }


        div.innerHTML = `

            <div class="milestone-icon">
                ${item.icon}
            </div>

            <div>

                <strong>
                    ${item.title}
                </strong>

                <p>
                    ${progress >= item.value
                        ? item.text
                        : "🔒 Complete more skills to unlock"
                    }
                </p>

            </div>

        `;


        container.appendChild(div);

    });

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeSkill(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}
